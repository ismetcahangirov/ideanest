# Integration tests run against configuration that matches a deployed
# environment, not the developer's. A health endpoint that hides component
# detail in production and shows it locally must be asserted against the
# production shape, or the assertion proves nothing.
spring:
  docker:
    compose:
      # Tests bring their own database. Starting the local stack underneath them
      # would race with it and leave a container running afterwards.
      enabled: false
  datasource:
    # Placeholders. Testcontainers replaces all three before the context starts;
    # they exist so that resolving application.yml does not fail on a missing
    # environment variable if a test ever runs without a container.
    url: jdbc:postgresql://localhost:1/replaced-by-testcontainers
    username: replaced-by-testcontainers
    password: replaced-by-testcontainers

ideanest:
  project:
    moderation:
      # One address, so the fail-closed default is exercised by every other
      # account in the suite: any account that is not this one is refused, which
      # is the assertion that matters. The moderator fixture registers exactly
      # this address.
      moderator-emails: moderator@ideanest.test

    story:
      # The production value. The window itself is what the tests are checking, so
      # shortening it here would mean asserting a rule against a configuration
      # nothing runs on — and there is no need: the suite moves the application's
      # Clock (AdjustableClock) rather than waiting, which is both deterministic
      # and instant.
      version-interval: 5m
      # Deliberately small. The retention rule is only observable once more
      # versions exist than are kept, and reaching fifty would mean fifty
      # documents written five minutes of simulated time apart for one assertion.
      # Three exercises exactly the same arithmetic.
      versions-kept: 3

    reminders:
      # Disabled, exactly as the anonymisation schedule is: `-` is Spring's own
      # value for "do not schedule this". The suite drives LaunchReminderJob
      # directly, which is deterministic; a sweep firing every minute in the
      # background of a test run would claim the very rows a test is about to
      # assert on.
      send-schedule: "-"
      # The suite shares one process and one limiter, and every test calls from
      # 127.0.0.1 — a realistic per-client limit would make the tests fail each
      # other rather than fail themselves. The per-address limit is left at a
      # value a test can actually reach, because each test uses its own address
      # and the limit is therefore exercised in isolation.
      signups-per-client: 100000
      signups-per-address: 3
      # Small enough that the sweep's batching is exercised rather than described:
      # a campaign with four followers takes two passes.
      send-batch-size: 3

  user:
    # Disabled. `-` is Spring's own value for "do not schedule this". The suite
    # drives AccountAnonymisationJob directly with the instant it wants to test,
    # which is both deterministic and instant; a timer firing in the background
    # of a test run is a source of failures that reproduce once a fortnight.
    anonymisation-schedule: "-"
    rate-limit:
      # Each test uses its own account, so these are exercised in isolation and
      # the real values would only make tests fail each other. Left low enough
      # that the limit itself can still be asserted.
      exports-per-account: 5
      deletion-attempts-per-account: 5

  auth:
    rate-limit:
      # The suite shares one process and one limiter, and every test calls from
      # 127.0.0.1. A realistic per-address limit would therefore make the tests
      # fail each other rather than fail themselves, so the per-address ceiling
      # is effectively off here and the per-email one is left at its real value:
      # each test uses its own address, so the limit is exercised in isolation.
      # The per-address path is covered by InMemoryRateLimiterTests instead.
      registrations-per-address: 100000
      verifications-per-address: 100000
      registrations-per-email: 3
      sign-ins-per-address: 100000
      sign-ins-per-email: 5
      social-sign-ins-per-address: 100000
    token:
      issuer: https://api.ideanest.test
    oauth:
      # The issuers and the key set addresses stay as they are in
      # application.yml -- the real Google and Apple issuer strings, so the
      # issuer check is exercised against the value production uses. Only the
      # jwks-uri is replaced, by AbstractIntegrationTest, because the stub takes
      # whichever port is free.
      providers:
        google:
          audiences: ideanest-test.apps.googleusercontent.com
        apple:
          audiences: az.ideanest.test
    refresh-cookie:
      # TestRestTemplate speaks plain HTTP, and a Secure cookie would never come
      # back — the cookie tests would then pass for the wrong reason.
      secure: false

management:
  endpoint:
    health:
      show-details: never
      show-components: never
