# Integration tests run against configuration that matches a deployed
# environment, not the developer's. A health endpoint that hides component
# detail in production and shows it locally must be asserted against the
# production shape, or the assertion proves nothing.
spring:
  docker:
    compose:
      # Tests bring their own database. Starting the local stack underneath them
      # would race with it and leave a container running afterwards.
      enabled: false
  datasource:
    # Placeholders. Testcontainers replaces all three before the context starts;
    # they exist so that resolving application.yml does not fail on a missing
    # environment variable if a test ever runs without a container.
    url: jdbc:postgresql://localhost:1/replaced-by-testcontainers
    username: replaced-by-testcontainers
    password: replaced-by-testcontainers

ideanest:
  abuse:
    # The suite shares one process, one limiter, and one client address: every
    # request in it comes from 127.0.0.1. A realistic per-address budget would
    # therefore make the discovery suites fail each other rather than fail
    # themselves, so it is effectively off here -- exactly as the sign-in limits
    # below are, and for the same reason. The boundary itself is asserted by
    # SearchRateLimitTests, which drives the endpoints with a limiter of its own.
    searches-per-address: 100000
    suggestions-per-address: 100000

  analytics:
    aggregation:
      # Disabled, exactly as every other schedule here is: `-` is Spring's own
      # value for "do not schedule this". The suite drives AnalyticsRollupService
      # directly, which is deterministic; a pass firing hourly in the background
      # would recompute the very rows a test is about to assert on -- and it would
      # do so against the real clock while the suite is moving AdjustableClock
      # across a midnight boundary.
      schedule: "-"
      # The production zone, deliberately. The timezone decision is what
      # AnalyticsRollupTests checks, and asserting a midnight boundary against a
      # zone nothing is deployed in would prove the arithmetic and nothing about
      # the answer a creator gets. UTC+4 is also what makes those tests mean
      # something: under UTC they would pass without exercising anything.
      zone: Asia/Baku
      # The production window. Late arrival is a rule this suite asserts, and a
      # shortened window here would assert a different one.
      re-rollup-window: PT72H

  project:
    moderation:
      # One address, so the fail-closed default is exercised by every other
      # account in the suite: any account that is not this one is refused, which
      # is the assertion that matters. The moderator fixture registers exactly
      # this address.
      moderator-emails: moderator@ideanest.test

    story:
      # The production value. The window itself is what the tests are checking, so
      # shortening it here would mean asserting a rule against a configuration
      # nothing runs on — and there is no need: the suite moves the application's
      # Clock (AdjustableClock) rather than waiting, which is both deterministic
      # and instant.
      version-interval: 5m
      # Deliberately small. The retention rule is only observable once more
      # versions exist than are kept, and reaching fifty would mean fifty
      # documents written five minutes of simulated time apart for one assertion.
      # Three exercises exactly the same arithmetic.
      versions-kept: 3

    reminders:
      # Disabled, exactly as the anonymisation schedule is: `-` is Spring's own
      # value for "do not schedule this". The suite drives LaunchReminderJob
      # directly, which is deterministic; a sweep firing every minute in the
      # background of a test run would claim the very rows a test is about to
      # assert on.
      send-schedule: "-"
      # The suite shares one process and one limiter, and every test calls from
      # 127.0.0.1 — a realistic per-client limit would make the tests fail each
      # other rather than fail themselves. The per-address limit is left at a
      # value a test can actually reach, because each test uses its own address
      # and the limit is therefore exercised in isolation.
      signups-per-client: 100000
      signups-per-address: 3
      # Small enough that the sweep's batching is exercised rather than described:
      # a campaign with four followers takes two passes.
      send-batch-size: 3

  pledge:
    reservation:
      # Disabled, exactly as the two schedules below are: `-` is Spring's own value
      # for "do not schedule this". The suite drives ReservationCleanerJob directly
      # with the instant it wants to test. A sweep firing every minute in the
      # background would release the very reservations a concurrency test is in the
      # middle of counting — and it would do it once a fortnight, on CI, in the run
      # nobody is watching.
      cleanup-schedule: "-"
      # The production value. The window is what the tests are checking, so
      # shortening it here would mean asserting the rule against a configuration
      # nothing runs on. There is no need either: the suite moves the application's
      # Clock (AdjustableClock) rather than waiting five minutes.
      ttl: 5m
      # Deliberately small. The bound is only observable once more reservations
      # have lapsed than one pass will take, and reaching two hundred would mean
      # two hundred checkouts for one assertion. Two exercises the same arithmetic.
      cleanup-batch-size: 2
    rate-limit:
      # The production values. The limit is per account and every test uses its
      # own backer, so it is exercised in isolation rather than by the tests
      # failing each other -- which is why this one does not need the ceiling
      # that the per-address auth limits below are given.
      pledges-per-user: 10
      window: PT1M

  idempotency:
    # Disabled, exactly as the two schedules below are: `-` is Spring's own value
    # for "do not schedule this". The suite drives IdempotencyKeySweeper directly
    # with the instant it wants to test, which is deterministic; a timer firing in
    # the background would delete the very keys a replay test is about to retry.
    sweep-schedule: "-"
    # The production value, §17.2's. The retention is what the sweep test is
    # about, so shortening it here would mean asserting the rule against a
    # configuration nothing runs on -- and there is no need, because the suite
    # moves the application's Clock rather than waiting a day.
    retention: PT24H
    # Deliberately small, like the reservation batch above and for the same
    # reason: the bound is only observable once more keys have expired than one
    # pass will take.
    sweep-batch-size: 2

  outbox:
    # Disabled, exactly as the schedules above are: `-` is Spring's own value for "do
    # not schedule this". The suite drives OutboxRelay and OutboxDispatch directly
    # with the instant it wants to test, which is deterministic. This one would
    # otherwise fire every second, publishing the very rows a test is in the middle
    # of asserting are still pending -- and it would claim them on another thread,
    # which is the hardest kind of flake to reproduce.
    poll-schedule: "-"
    # The production values. The retry policy is what the exhaustion test is about,
    # so shortening it here would mean asserting the rule against a configuration
    # nothing runs on -- and there is no need, because the tests hand the dispatch
    # the instant to judge rather than waiting for a backoff to elapse.
    batch-size: 100
    retry-backoff: PT5S
    max-backoff: PT10M
    max-attempts: 8

  notification:
    delivery:
      # Disabled, exactly as the outbox relay above is and for the identical reason:
      # this one would otherwise fire every second and send the very rows a test is
      # in the middle of asserting are still PENDING, on another thread. The suite
      # drives NotificationSender and NotificationDispatch directly with the instant
      # it wants to judge against.
      send-schedule: "-"
      # Deliberately small, so that the bound on a pass is observable at all. With
      # the production hundred, a test proving that a backlog is not drained in one
      # pass would have to write a hundred and one notifications to see it.
      batch-size: 2
      # The production retry policy, because the retry and dead-letter tests are
      # about that policy: shortening it here would assert the rule against a
      # configuration nothing runs on. There is no need, because the tests hand the
      # dispatch the instant to judge rather than waiting for a backoff to elapse.
      retry-backoff: PT5S
      max-backoff: PT10M
      max-attempts: 8
    digest:
      # Disabled, exactly as the delivery schedule above is and for the identical
      # reason: this one would otherwise fire on the hour and combine the very rows
      # a test is in the middle of asserting are still HELD, on another thread. The
      # suite drives NotificationDigestJob and DigestAssembly directly with the
      # instant it wants to judge the digest period against.
      schedule: "-"
      # UTC here rather than the production Asia/Baku, so that a test computing an
      # expected digest boundary does it in the zone its own instants are in. What
      # the zone is for is argued in DigestWindow; that argument is about a real
      # deployment sending mail to a real person, and a suite has neither.
      zone: "UTC"
      at-hour: 8
      # Deliberately small, so that the bound on a pass is observable at all —
      # the same reason the delivery batch size above is two.
      batch-size: 2
      # Small for the same reason: a test proving that a digest is bounded and that
      # the remainder stays held and due would otherwise need two hundred and one
      # notifications to see it.
      max-notifications-per-message: 3
    audience:
      # Deliberately tiny, so that the bound on a computed audience is observable at
      # all. The production five thousand is above every campaign the platform has,
      # which is the point of it and would also mean a test proving the bound exists
      # had to insert five thousand and one pledges.
      max-recipients: 3

  user:
    # Disabled. `-` is Spring's own value for "do not schedule this". The suite
    # drives AccountAnonymisationJob directly with the instant it wants to test,
    # which is both deterministic and instant; a timer firing in the background
    # of a test run is a source of failures that reproduce once a fortnight.
    anonymisation-schedule: "-"
    rate-limit:
      # Each test uses its own account, so these are exercised in isolation and
      # the real values would only make tests fail each other. Left low enough
      # that the limit itself can still be asserted.
      exports-per-account: 5
      deletion-attempts-per-account: 5

  auth:
    rate-limit:
      # The suite shares one process and one limiter, and every test calls from
      # 127.0.0.1. A realistic per-address limit would therefore make the tests
      # fail each other rather than fail themselves, so the per-address ceiling
      # is effectively off here and the per-email one is left at its real value:
      # each test uses its own address, so the limit is exercised in isolation.
      # The per-address path is covered by InMemoryRateLimiterTests instead.
      registrations-per-address: 100000
      verifications-per-address: 100000
      registrations-per-email: 3
      sign-ins-per-address: 100000
      sign-ins-per-email: 5
      social-sign-ins-per-address: 100000
    token:
      issuer: https://api.ideanest.test
    oauth:
      # The issuers and the key set addresses stay as they are in
      # application.yml -- the real Google and Apple issuer strings, so the
      # issuer check is exercised against the value production uses. Only the
      # jwks-uri is replaced, by AbstractIntegrationTest, because the stub takes
      # whichever port is free.
      providers:
        google:
          audiences: ideanest-test.apps.googleusercontent.com
        apple:
          audiences: az.ideanest.test
    refresh-cookie:
      # TestRestTemplate speaks plain HTTP, and a Secure cookie would never come
      # back — the cookie tests would then pass for the wrong reason.
      secure: false

management:
  endpoint:
    health:
      show-details: never
      show-components: never
