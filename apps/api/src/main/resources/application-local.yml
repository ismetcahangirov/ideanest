# Local development only. These credentials match compose.yaml, are reachable
# from nowhere but this machine, and are not secrets in any sense that matters.
# Every deployed environment supplies DB_URL, DB_USERNAME, and DB_PASSWORD from
# the secret store and never reads this file.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ideanest}
    username: ${DB_USERNAME:ideanest}
    password: ${DB_PASSWORD:ideanest}

  docker:
    compose:
      enabled: true
      file: compose.yaml
      lifecycle-management: start_and_stop

  jpa:
    # Useful locally and nowhere else: it is how an N+1 is noticed before it
    # reaches a dashboard.
    show-sql: false
    properties:
      hibernate:
        format_sql: true

ideanest:
  project:
    collaborators:
      # Same reason, same scope: without a mail transport an invitation cannot be
      # accepted locally unless the link is on the console. Local only — see
      # LoggingCollaboratorInvitationNotifier.
      log-invitation-links: true

    reminders:
      # Same reason, same scope: the unsubscribe token exists only in a message
      # nothing sends yet, so locally the console is the message. Local only —
      # see LoggingLaunchReminderNotifier.
      log-unsubscribe-links: true

  auth:
    # There is no mail transport yet (#86), so the verification link is written
    # to the console. Local only — see LoggingVerificationNotifier.
    log-verification-links: true
    token:
      issuer: http://localhost:8080
    refresh-cookie:
      # localhost is plain HTTP, and a Secure cookie there is simply never sent.
      secure: false

management:
  endpoint:
    health:
      # Locally the point of health is to say which dependency is down.
      show-details: always
      show-components: always

logging:
  level:
    org.flywaydb: INFO
    org.hibernate.SQL: INFO
