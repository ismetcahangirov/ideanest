# §21.1's primary language. The same keys as messages.properties, in the same order.
#
# ---------------------------------------------------------------------------
# THE ARGUMENTS ARE THE ENGLISH FILE'S, AND THEY ARE POSITIONAL
# ---------------------------------------------------------------------------
#
#   {0}  the recipient's name
#   {1}  the campaign's title
#   {2}  the amount, already formatted -- "25.00 AZN"
#   {3}  the type's one further fact
#
# A translation may put them in a different order and may leave one out where the
# sentence does not need it. It may NOT refer to a slot its type does not fill:
# EmailCopyTests renders every key of every language with empty facts and fails on
# a stray placeholder, which is what stops a key gaining a hole in one language.
#
# ---------------------------------------------------------------------------
# APOSTROPHES
# ---------------------------------------------------------------------------
#
# Every line here is a java.text.MessageFormat pattern, where a single quote opens
# a literal section and {0} inside one is printed as the four characters rather
# than substituted. Azerbaijani attaches suffixes to a proper noun without an
# apostrophe, so these lines have none; a translation that needs one must double
# it. EmailCopyTests asserts that no line carries a lone quote.
