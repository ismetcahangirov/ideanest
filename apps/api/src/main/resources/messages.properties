email.PLEDGE_CONFIRMED.body=Your pledge of {2} is confirmed. Nothing is charged now: on this platform a pledge is collected only if the campaign reaches its goal by its deadline.
email.PLEDGE_CONFIRMED.body2=You can change or cancel it at any time while the campaign is still open.
email.PLEDGE_CONFIRMED.action=View the campaign
email.PLEDGE_CONFIRMED.line=Your pledge of {2} was confirmed

email.PLEDGE_EDITED.subject=Your pledge has been updated
