# #86's email copy. Every line an email says, in one place.
#
# ---------------------------------------------------------------------------
# THE ARGUMENTS
# ---------------------------------------------------------------------------
#
# Every key here is a java.text.MessageFormat pattern over the same four
# arguments, in this order. EmailFacts is the record that fills them and it
# carries the same list.
#
#   {0}  the recipient's name
#   {1}  the campaign's title
#   {2}  the amount the message is about, formatted -- "25.00 AZN"
#   {3}  the type's one further fact -- an attempt number, a backer count
#
# **{1} is empty on every type today**, and no key below uses it. params has no
# title in it: NotificationEventListener writes projectId, and the events behind
# it have no title field to write. Supplying one is a shared port plus a change
# to seven translations, across three modules, and it is not #86. So the copy is
# written to read correctly without a title, and it says "this campaign" where a
# name would go.
#
# A slot a type does not fill renders as nothing, so a key that referred to one
# would leave a hole in the sentence. EmailCopyTests renders every key of every
# type with empty facts and fails on a stray placeholder.
#
# ---------------------------------------------------------------------------
# THE KEYS
# ---------------------------------------------------------------------------
#
# Per NotificationType:
#
#   .subject   the subject line
#   .headline  the first line of the body
#   .body      the body. .body2 is optional and only where a second paragraph
#              earns its place
#   .action    the button. Its destination is EmailComposer's, and it is always
#              a route the web application actually has -- so no label here may
#              promise a page that does not exist
#   .line      the same message as one line inside a digest
#
# A single quote is doubled, because MessageFormat reads a lone one as the start
# of a quoted section and silently drops it along with whatever follows.
#
# ---------------------------------------------------------------------------
# Pledges
# ---------------------------------------------------------------------------

