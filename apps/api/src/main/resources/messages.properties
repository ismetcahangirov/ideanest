# ---------------------------------------------------------------------------
# The digest -- one message about several things
# ---------------------------------------------------------------------------
#
# {3} is the number of notifications in it. There is no .action: every line is
# already a link to the thing it is about, and EmailComposer says why one button
# would have to pick between them.

email.digest.subject=Your IdeaNest summary
email.digest.headline=Here is what happened, {0}
email.digest.body=You asked for these as a daily summary rather than one message at a time. There are {3}.

