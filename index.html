<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex" />
    <title>IdeaNest Storybook builds</title>
    <style>
      :root { color-scheme: dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        background: #0d0d0d;
        color: #fff;
        font: 400 16px/1.6 ui-sans-serif, system-ui, -apple-system, sans-serif;
        letter-spacing: -0.01em;
      }
      main { max-width: 34rem; padding: 2rem; }
      h1 { font-size: 1.5rem; font-weight: 500; letter-spacing: -0.02em; margin: 0 0 0.5rem; }
      p { color: rgb(255 255 255 / 0.64); margin: 0 0 1.25rem; }
      code { color: #c6f432; font-family: ui-monospace, monospace; font-size: 0.875em; }
      a {
        display: inline-block;
        padding: 10px 18px;
        border-radius: 9999px;
        background: #c6f432;
        color: #0a0a0a;
        font-weight: 500;
        text-decoration: none;
      }
      a:focus-visible { outline: 2px solid #0a0a0a; outline-offset: 2px; }
    </style>
  </head>
  <body>
    <main>
      <h1>IdeaNest Storybook builds</h1>
      <p>
        This branch is written by CI only. The build for <code>main</code> lives at
        <code>/main/</code>; each open pull request publishes to <code>/pr-&lt;number&gt;/</code>
        and is deleted when the pull request closes.
      </p>
      <a href="./main/">Open the main build</a>
    </main>
  </body>
</html>
