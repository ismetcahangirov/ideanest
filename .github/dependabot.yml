version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - 'type: chore'
      - 'area: infra'
    ignore:
      # @types/node must track the runtime major, not lead it. Types ahead of
      # the runtime let code typecheck against APIs that do not exist at run
      # time, so the failure surfaces in production rather than in CI.
      # Raise this deliberately when the Node version in ci.yml changes.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
      # `packages/api-client` is on TypeScript 5 and the rest of the repository
      # is on 7. That is not drift, it is the generator: `openapi-typescript`
      # builds `schema.ts` through the compiler API, and TypeScript 7 does not
      # expose `ts.factory` at all, so the generator throws on import. Its
      # latest release declares `typescript: ^5.x` as a peer and upstream has
      # no fix (openapi-ts/openapi-typescript#2841). A major bump here cannot
      # go green, so it is not worth proposing every Monday.
      # Drop this when #334 closes, not before.
      - dependency-name: 'typescript'
        update-types: ['version-update:semver-major']
      # jest 30 does not run under jest-expo, which is pinned to the Expo SDK
      # and builds its preset against jest 29: every mobile suite fails to
      # start with `this._moduleMocker.clearMocksOnScope is not a function`.
      # The bump cannot go green until jest-expo ships a jest 30 preset, so it
      # is not worth proposing every Monday.
      # Drop this when apps/mobile's jest-expo supports jest 30, not before.
      - dependency-name: 'jest'
        update-types: ['version-update:semver-major']
      - dependency-name: '@types/jest'
        update-types: ['version-update:semver-major']
    groups:
      # THE MOBILE GROUP EXISTS SO ONE BROKEN NATIVE BUMP CANNOT HOLD BACK THE
      # WEB.
      #
      # This ecosystem watches the whole workspace, so a single production
      # group put React Native, Expo and the native modules in the same pull
      # request as Next.js and next-intl. React Native 0.87 changed the style
      # prop types, which fails `apps/mobile typecheck` in a way that takes a
      # migration to fix — and while that sat unmerged it was also holding two
      # Next.js patch releases and a next-intl minor hostage. One group cannot
      # be half-merged.
      #
      # Listed first because a dependency belongs to the first group it
      # matches, and every name here would otherwise fall into one of the two
      # below.
      mobile-dependencies:
        patterns:
          - 'react-native'
          - 'react-native-*'
          - '@react-native*'
          - 'expo'
          - 'expo-*'
          - '@expo/*'
          - '@shopify/flash-list'
          # jest is apps/mobile's alone -- apps/web and packages/ui are on
          # vitest -- and its version is decided by jest-expo, which is decided
          # by the Expo SDK. It belongs with the thing that pins it.
          - 'jest'
          - 'jest-*'
          - '@types/jest'
        update-types: [minor, patch]
      # One pull request per ecosystem keeps the review load sane. Major
      # versions stay separate because they need a real read.
      dev-dependencies:
        dependency-type: development
        update-types: [minor, patch]
      production-dependencies:
        dependency-type: production
        update-types: [minor, patch]

  - package-ecosystem: gradle
    directory: /apps/api
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - 'type: chore'
      - 'area: backend'

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - 'type: chore'
      - 'area: infra'
